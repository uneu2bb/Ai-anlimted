name: Build Android APK (triggered)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:
    inputs:
      app_url:
        description: "Public HTTPS URL of the deployed AI Unlimited website"
        required: false
        default: "https://ai-unlimited-0-4191.vercel.app"
        type: string

permissions:
  contents: read

jobs:
  build-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install web project dependencies
        run: npm install

      - name: Install Capacitor Android tools
        run: npm install --no-save @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7

      - name: Add Android platform
        env:
          APP_URL: ${{ inputs.app_url || 'https://ai-unlimited-0-4191.vercel.app' }}
        run: npx cap add android

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-unlimited-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
